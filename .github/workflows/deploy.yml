name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            ssh -o StrictHostKeyChecking=no root@10.0.1.4 << 'REMOTE'
            cd /tmp/web-selva
            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_selva -o StrictHostKeyChecking=no" git pull origin main
            docker build -t selva-web:latest .
            docker rm -f selva-web
            docker run -d --name selva-web -p 3600:80 --restart unless-stopped selva-web:latest
            REMOTE
